<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assistente IA</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --line: #2a2f3a;
    --text: #e6e8ee;
    --muted: #9aa3b2;
    --accent: #6d5efc;
    --accent-hover: #7d70ff;
    --user: #6d5efc;
    --bot: #232833;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100dvh;
  }

  .chat {
    width: min(820px, 100%);
    height: min(860px, 100dvh);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
  }
  .avatar {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #4bd6c4);
    font-size: 18px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  header .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #3ddc84; margin-right: 5px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: #333a47; border-radius: 8px; }

  .msg { display: flex; gap: 10px; max-width: 88%; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.bot { align-self: flex-start; }
  .msg.bot .bubble {
    background: var(--bot);
    border: 1px solid var(--line);
    border-top-left-radius: 4px;
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .bubble {
    background: var(--user);
    border-top-right-radius: 4px;
    color: #fff;
  }
  .msg .icon {
    flex: 0 0 28px;
    width: 28px; height: 28px;
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
  }
  .msg.user .icon { background: #4a3ff0; border-color: #4a3ff0; }

  .typing .bubble { display: flex; gap: 4px; align-items: center; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  form {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel-2);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    font: inherit;
    max-height: 140px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    border: none;
    background: var(--accent);
    color: #fff;
    width: 46px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:active:not(:disabled) { transform: scale(.96); }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="chat">
    <header>
      <div class="avatar">✦</div>
      <div>
        <h1>Assistente IA</h1>
        <div class="status"><span class="dot"></span>online</div>
      </div>
    </header>

    <div class="messages" id="messages"></div>

    <form id="form">
      <textarea id="input" rows="1" placeholder="Escreva uma mensagem..."></textarea>
      <button type="submit" id="send" aria-label="Enviar">➤</button>
    </form>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function addMessage(text, role) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    wrap.innerHTML = `<div class="icon">${role === 'user' ? '👤' : '✦'}</div>`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot typing';
    wrap.innerHTML =
      '<div class="icon">✦</div><div class="bubble"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  // Resposta simulada. Substitua por uma chamada real à sua API/LLM.
  async function getReply(prompt) {
    await new Promise((r) => setTimeout(r, 700 + Math.random() * 700));
    return `Recebi sua mensagem: "${prompt}".\n\nEsta é uma resposta simulada — conecte aqui sua API de IA.`;
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    input.focus();

    sendBtn.disabled = true;
    const typing = showTyping();
    try {
      const reply = await getReply(text);
      typing.remove();
      addMessage(reply, 'bot');
    } catch (err) {
      typing.remove();
      addMessage('Erro ao obter resposta. Tente novamente.', 'bot');
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener('submit', handleSubmit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  addMessage('Olá! Sou seu assistente de IA. Como posso ajudar hoje?', 'bot');
</script>
</body>
</html>
